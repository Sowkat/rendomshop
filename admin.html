
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Shop Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222}
header{background:#f85606;color:white;padding:18px}
main{max-width:850px;margin:auto;padding:15px}
.box{background:white;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 2px 8px #0001}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:7px;font-size:15px}
button{border:0;padding:12px 17px;border-radius:7px;background:#f85606;color:white;cursor:pointer;margin:4px}
button:disabled{opacity:.6}
.delete{background:#d62828}
.secondary{background:#555}
.hidden{display:none!important}
.product{background:#fff3eb;padding:13px;margin:12px 0;border-radius:9px;overflow:hidden}
.product img{width:75px;height:75px;object-fit:contain;float:right}
#loginMessage,#message{color:#d33;white-space:pre-wrap;overflow-wrap:anywhere}
#loginMessage:empty,#message:empty{display:none}
</style>
</head>
<body>

<header><h2>🛍️ Orange Shop Admin</h2></header>

<main>
<section id="loginBox" class="box">
<h3>🔐 Admin Login</h3>
<p>অনুমোদিত Gmail দিয়ে প্রবেশ করুন।</p>
<button id="googleLoginBtn" type="button">🌐 Continue with Google</button>
<p id="loginMessage"></p>
</section>

<section id="panel" class="hidden">
<div class="box">
<h3>পণ্য যোগ করুন / Edit করুন</h3>
<input id="name" placeholder="পণ্যের নাম">
<input id="price" type="number" placeholder="দাম (৳)">
<input id="category" placeholder="ক্যাটাগরি">
<input id="image" type="url" placeholder="ছবির URL">
<input id="url" type="url" placeholder="Daraz Affiliate Link">
<button id="saveBtn" type="button">পণ্য সংরক্ষণ</button>
<button class="secondary" id="resetBtn" type="button">নতুন পণ্য</button>
<p id="message"></p>
</div>

<div class="box">
<h3>আপনার সব পণ্য</h3>
<div id="productList">লোড হচ্ছে...</div>
</div>

<button class="secondary" id="logoutBtn" type="button">Logout</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
(function(){
"use strict";

const ADMIN_EMAIL = "sowkat420@gmail.com";
const $ = id => document.getElementById(id);

let auth, db, editingId = null;
let productsListener = null;

function showError(message){
  $("loginMessage").textContent = message;
}

function showPanel(user){
  if(!user || (user.email || "").toLowerCase() !== ADMIN_EMAIL){
    $("panel").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    return false;
  }

  $("loginBox").classList.add("hidden");
  $("panel").classList.remove("hidden");
  loadProducts();
  return true;
}

try{
  if(typeof firebase === "undefined"){
    throw new Error("Firebase SDK লোড হয়নি।");
  }

  if(typeof firebaseConfig === "undefined"){
    throw new Error("firebase-config.js ফাইল পাওয়া যায়নি অথবা config ভুল।");
  }

  if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }

  auth = firebase.auth();
  db = firebase.database();

}catch(error){
  showError("Firebase Setup Error: " + error.message);
  $("googleLoginBtn").disabled = true;
  return;
}

const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

auth.onAuthStateChanged(async user => {
  if(!user){
    $("loginBox").classList.remove("hidden");
    $("panel").classList.add("hidden");
    $("googleLoginBtn").disabled = false;
    return;
  }

  if((user.email || "").toLowerCase() !== ADMIN_EMAIL){
    showError("এই Gmail Admin হিসেবে অনুমোদিত নয়।");
    await auth.signOut();
    return;
  }

  showPanel(user);
});

// Google Login: প্রথমে Popup, প্রয়োজন হলে Redirect
$("googleLoginBtn").addEventListener("click", async function(){
  this.disabled = true;
  showError("Google Login চালু হচ্ছে...");

  try{
    await auth.signInWithPopup(provider);
    showError("");
  }catch(error){

    if(error.code === "auth/popup-blocked" ||
       error.code === "auth/operation-not-supported-in-this-environment"){

      try{
        showError("Redirect Login চালু হচ্ছে...");
        await auth.signInWithRedirect(provider);
        return;
      }catch(redirectError){
        showError(redirectError.code + "\n" + redirectError.message);
      }

    }else{
      showError(error.code + "\n" + error.message);
    }
  }

  this.disabled = false;
});

// Redirect result
auth.getRedirectResult().catch(error => {
  showError(error.code + "\n" + error.message);
  $("googleLoginBtn").disabled = false;
});

// Logout
$("logoutBtn").addEventListener("click", async function(){
  try{
    await auth.signOut();
  }catch(error){
    alert(error.message);
  }
});

// Reset form
function resetForm(){
  editingId = null;
  ["name","price","category","image","url"].forEach(id => {
    $(id).value = "";
  });
  $("saveBtn").textContent = "পণ্য সংরক্ষণ";
  $("message").textContent = "";
}
$("resetBtn").addEventListener("click",resetForm);

// Save product
$("saveBtn").addEventListener("click",async function(){
  const user = auth.currentUser;

  if(!user || (user.email || "").toLowerCase() !== ADMIN_EMAIL){
    alert("Admin Login প্রয়োজন।");
    return;
  }

  const data = {
    name:$("name").value.trim(),
    price:$("price").value.trim(),
    category:$("category").value.trim(),
    image:$("image").value.trim(),
    url:$("url").value.trim()
  };

  if(!data.name || !data.price || !data.image || !data.url){
    $("message").textContent = "সব প্রয়োজনীয় তথ্য পূরণ করুন।";
    return;
  }

  if(!/^https:\/\//i.test(data.image) ||
     !/^https:\/\//i.test(data.url)){
    $("message").textContent = "ছবি ও Affiliate Link HTTPS হতে হবে।";
    return;
  }

  this.disabled = true;

  try{
    if(editingId){
      await db.ref("products/" + editingId).update(data);
    }else{
      await db.ref("products").push(data);
    }

    resetForm();
    $("message").textContent = "পণ্য সফলভাবে সংরক্ষণ হয়েছে!";

  }catch(error){
    $("message").textContent = error.code + ": " + error.message;
  }finally{
    this.disabled = false;
  }
});

// Load products
function loadProducts(){
  const ref = db.ref("products");

  if(productsListener){
    ref.off("value",productsListener);
  }

  productsListener = snapshot => {
    const list = $("productList");
    list.innerHTML = "";

    if(!snapshot.exists()){
      list.textContent = "এখনো কোনো পণ্য যোগ করা হয়নি।";
      return;
    }

    snapshot.forEach(child => {
      const p = child.val() || {};
      const item = document.createElement("div");
      item.className = "product";

      const img = document.createElement("img");
      img.src = p.image || "";
      img.alt = p.name || "Product";

      const title = document.createElement("strong");
      title.textContent = p.name || "পণ্য";

      const price = document.createElement("p");
      price.textContent = "৳ " + (p.price || "");

      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.onclick = () => {
        editingId = child.key;
        $("name").value = p.name || "";
        $("price").value = p.price || "";
        $("category").value = p.category || "";
        $("image").value = p.image || "";
        $("url").value = p.url || "";
        $("saveBtn").textContent = "পরিবর্তন সংরক্ষণ";
        window.scrollTo({top:0,behavior:"smooth"});
      };

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.className = "delete";

      del.onclick = async () => {
        if(confirm("এই পণ্য মুছে ফেলবেন?")){
          try{
            await db.ref("products/" + child.key).remove();
          }catch(error){
            alert(error.code + ": " + error.message);
          }
        }
      };

      item.append(img,title,price,edit,del);
      list.appendChild(item);
    });
  };

  ref.on("value",productsListener,error => {
    $("productList").textContent =
      "Database Error: " + error.code + "\n" + error.message;
  });
}

})();
</script>
</body>
</html>
